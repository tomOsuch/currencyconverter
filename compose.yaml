services:
  postgres:
    image: postgres:17-alpine
    container_name: currency-converter-db
    environment:
      POSTGRES_DB: currency_converter
      POSTGRES_USER: converter
      POSTGRES_PASSWORD: converter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U converter -d currency_converter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: