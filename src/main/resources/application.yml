spring:
  application:
    name: currencyconverter
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:currency_converter}
    username: ${DB_USER:converter}
    password: ${DB_PASSWORD:converter}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  docker:
    compose:
      lifecycle-management: start-only

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html